###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$app_prefix = uwsm app --
$terminal = $app_prefix kitty --title kitty --single-instance
$file_manager = $app_prefix thunar
$rofi = pkill rofi || rofi
$exit = uwsm stop
$lock = pidof hyprlock || $app_prefix hyprlock

$scripts = bash ~/.config/hypr/scripts

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
exec-once = $app_prefix swayosd-server
exec-once = $app_prefix swaync
exec-once = $app_prefix fcitx5
exec-once = $app_prefix udiskie
exec-once = $app_prefix wl-paste -p --watch wl-copy -pc  # Auto clear primary clipboard
exec-once = [workspace 2 silent] $terminal


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = EDITOR,nvim
env = TERMINAL,kitty


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 0, 5, 5, 5
    border_size = 0

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true
    resize_corner = 1

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
    no_focus_fallback = true
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 8
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    dim_inactive = true
    dim_strength = 0.2

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 2

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}


# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to main_mod + P in the keybinds section below
    force_split = 2
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
    font_family = Inter
    new_window_takes_over_fullscreen = 2
}

ecosystem {
    enforce_permissions = true
}

render {
    send_content_type = false
}

#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        scroll_factor = 0.5
    }
}

cursor {
    no_warps = true
    inactive_timeout = 2
    hide_on_key_press = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$main_mod = ALT

submap = reset

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $main_mod, Return, exec, $terminal
bind = $main_mod, C, killactive,
bind = $main_mod, M, exec, $rofi -show power -theme power
bind = $main_mod SHIFT, M, exec, $exit
bind = $main_mod, E, exec, $file_manager
bind = $main_mod, V, togglefloating,
bind = $main_mod, F, fullscreenstate, 2 -1
bind = $main_mod, B, togglesplit, # dwindle
bind = $main_mod, P, pin
bind = SUPER, S, exec, $scripts/screenshot.sh
bind = SUPER SHIFT, S, exec, $scripts/screenshot.sh select

bind = $main_mod, Space, exec, $rofi -show drun

#--------------------------------------------------
bind = SUPER, Space, submap, launch
#--------------------------------------------------
submap = launch

bind = , l, exec, $rofi -show run
bind = , k, exec, $rofi -show kill -theme kill
bind = , f, exec, $rofi -show recursivebrowser
bind = , t, exec, $rofi -show temp -theme temp

bind = , Space, submap, reset
bind = , l, submap, reset
bind = , k, submap, reset
bind = , f, submap, reset
bind = , t, submap, reset
bind = , catchall, submap, reset

submap = reset
#--------------------------------------------------

#--------------------------------------------------
# preselect submap
# bind = $main_mod, P, submap, preselect # dwindle
#--------------------------------------------------
submap = preselect
bind = , H, layoutmsg, preselect l
bind = , J, layoutmsg, preselect d
bind = , K, layoutmsg, preselect u
bind = , L, layoutmsg, preselect r
bind = , H, submap, reset
bind = , J, submap, reset
bind = , K, submap, reset
bind = , L, submap, reset
bind = , catchall, submap, reset
submap = reset
#--------------------------------------------------

#--------------------------------------------------
# locked submap
bind = CTRL ALT, Space, submap, locked
#--------------------------------------------------
submap = locked
bind = CTRL ALT, Space, submap, reset
bind = , catchall, pass, activewindow
submap = reset
#--------------------------------------------------

# Move focus with main_mod + HJKL
bind = $main_mod, H, movefocus, l
bind = $main_mod, J, movefocus, d
bind = $main_mod, K, movefocus, u
bind = $main_mod, L, movefocus, r

# Move windows with main_mod + HJKL
bind = $main_mod SHIFT, H, movewindow, l
bind = $main_mod SHIFT, J, movewindow, d
bind = $main_mod SHIFT, K, movewindow, u
bind = $main_mod SHIFT, L, movewindow, r

# Switch workspaces with main_mod + [0-9]
bind = $main_mod, grave, workspace, 1
bind = $main_mod, 1,     workspace, 2
bind = $main_mod, 2,     workspace, 3
bind = $main_mod, 3,     workspace, 4
bind = $main_mod, 4,     workspace, 5
bind = $main_mod, 5,     workspace, 6
bind = $main_mod, 6,     workspace, 7
bind = $main_mod, 7,     workspace, 8
bind = $main_mod, 8,     workspace, 9
bind = $main_mod, 9,     workspace, 10
bind = $main_mod, tab,   workspace, previous
bind = $main_mod, S,     togglespecialworkspace, magic

# Move active window to a workspace with main_mod + SHIFT + [0-9]
bind = $main_mod SHIFT, grave, movetoworkspace, 1
bind = $main_mod SHIFT, 1,     movetoworkspace, 2
bind = $main_mod SHIFT, 2,     movetoworkspace, 3
bind = $main_mod SHIFT, 3,     movetoworkspace, 4
bind = $main_mod SHIFT, 4,     movetoworkspace, 5
bind = $main_mod SHIFT, 5,     movetoworkspace, 6
bind = $main_mod SHIFT, 6,     movetoworkspace, 7
bind = $main_mod SHIFT, 7,     movetoworkspace, 8
bind = $main_mod SHIFT, 8,     movetoworkspace, 9
bind = $main_mod SHIFT, 9,     movetoworkspace, 10
bind = $main_mod SHIFT, S,     movetoworkspace, special:magic

#--------------------------------------------------
# resize submap
bind = $main_mod, R, submap, resize
#--------------------------------------------------
submap = resize
$resizeStep = 15
binde = , h, resizeactive, -$resizeStep 0
binde = , j, resizeactive, 0 $resizeStep
binde = , k, resizeactive, 0 -$resizeStep
binde = , l, resizeactive, $resizeStep 0
bind = , catchall, submap, reset
submap = reset
#--------------------------------------------------

# Scroll through existing workspaces with main_mod + scroll
bind = $main_mod, mouse_down, workspace, e+1
bind = $main_mod, mouse_up, workspace, e-1

# Move/resize windows with main_mod + LMB/RMB and dragging
bindm = $main_mod, mouse:272, movewindow
bindm = $main_mod, mouse:273, resizewindow

# Multimedia keys for volume and LCD brightness
$swayosd_client = $app_prefix swayosd-client

$volume_up = $swayosd_client --output-volume +5
$volume_down = $swayosd_client --output-volume -5
$mute = $swayosd_client --output-volume mute-toggle
$mute_mic = $app_prefix wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
$bright_up = $swayosd_client --brightness +10
$bright_down = $swayosd_client --brightness -10

bindel = , XF86AudioRaiseVolume, exec, $volume_up
bindel = , XF86AudioLowerVolume, exec, $volume_down
bindel = , XF86AudioMute, exec, $mute
bindel = , XF86AudioMicMute, exec, $mute_mic
bindel = , XF86MonBrightnessUp, exec, $bright_up
bindel = , XF86MonBrightnessDown, exec, $bright_down

$f23 = XF86TouchpadOff
bind = , $f23, exec, $lock
bind = , XF86Sleep, exec, $lock
bind = , switch:Lid Switch, exec, $lock

$toggle_waybar = killall -SIGUSR1 waybar
bind = $main_mod, W, exec, $toggle_waybar

# Requires playerctl
$playerctl = $app_prefix playerctl

bindl = , XF86AudioNext, exec, $playerctl next
bindl = , XF86AudioPause, exec, $playerctl play-pause
bindl = , XF86AudioPlay, exec, $playerctl play-pause
bindl = , XF86AudioPrev, exec, $playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Picture in picture
windowrule = float,title:^(P|p)icture\Win\W(P|p)icture$
windowrule = keepaspectratio,title:^(P|p)icture\Win\W(P|p)icture$
windowrule = nodim,title:^(P|p)icture\Win\W(P|p)icture$
windowrule = pin,title:^(P|p)icture\Win\W(P|p)icture$
windowrule = move onscreen 100% 0%,title:^(P|p)icture\Win\W(P|p)icture$

windowrule = move onscreen cursor 0 0,class:^gsimplecal$
windowrule = pin,class:^gsimplecal$
windowrule = dimaround,class:^gsimplecal$

windowrule = nodim,pinned:1

windowrule = nodim,class:^mpv$
windowrule = nodim,title:^Solanum$
windowrule = nodim,class:^org.pwmt.zathura$


#############################
###      PERMISSIONS      ###
#############################

permission = /usr/bin/hyprlock, screencopy, allow
permission = /usr/bin/hyprpicker, screencopy, allow
permission = /usr/bin/grim, screencopy, allow
